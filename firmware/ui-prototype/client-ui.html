<!-- 
    Web UI prototype for team 23 SMAPD -- JSON PACKET version
    To be sent by MCU over Ethernet connection and displayed on a laptop

    Features:
        - Live voltage and current displayed on selectable graphs
        - CAN wire tap
        - User console

    Created:    11.6.2026
    Modified:   11.6.2026
-->

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1.0">
    <title>[prototype] SMAPD Control</title>
    <style>
        :root {
            /* any style variables here */
            --background-color: white;
        }

        body {
            font-family: Arial, Arial, Helvetica, sans-serif;
            background-color: var(--background-color);
            padding: 5px;
            /* top and side padding*/
        }

        h1 {
            color: blue
        }

        .console-window {
            background-color: #1e1e1e;
            color: white;
            font-family:'Courier New', Courier, monospace;
            border-radius: 8px;
            overflow: auto;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
        }

        .console-log-command {
            color: lightskyblue;
        }
        .console-log-info {
            color: white;
        }
        .console-log-error {
            color: red;
        }
        .console-log-warning {
            color: orange;
        }

        .console-header {
            background-color: black;
            color: #9cdcfe;
            font-family: Arial, Helvetica, sans-serif;
            border-bottom: 1px solid red;
        }
        .console-input-box {
            display: flex;
            align-items: center;
            background-color: black;
            border-top: 1px solid red;

        }
        #console-input-text {
            flex: 1;
            background: transparent;
            border: none;
            color: greenyellow;
            font-family: inherit;
            font-size: 0.95rem;
            outline: none;
    }

        .console-prompt-symbol {
            color: #4ec9b0;
            font-weight: bold;
            margin-right: 8px;
        }

    </style>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="console.js" defer></script>
    <script src="port-functions.js" defer></script>
    <script src="scripts.js" defer></script>

</head>

<body>
    <p>Select the ports to see:</p>
    <div id="portSelectionArea"> 
        <!-- JS code to add dropdowns-->
    </div>

    <div id="console-window" class="console-window">
        <div class="console-header">
            <span>Console</span>
        </div>
        <div id="console-output", class="console-output">
            Hello! This is the first log.
        </div>
        <div id="console-input-box">
            <span class="prompt-symbol">&gt;</span>
            <input type="text" id="console-input-text" placeholder="Enter command..." autocomplete="off" spellcheck="false">
        </div>

    </div>



</body>

</html>

<!-- 
    Web UI prototype for team 23 SMAPD -- JSON PACKET version
    To be sent by MCU over Ethernet connection and displayed on a laptop

    Features:
        - Live voltage and current displayed on selectable graphs
        - CAN wire tap
        - User console

    Created:    11.6.2026
    Modified:   11.6.2026
-->

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1.0">
    <title>[prototype] SMAPD Control</title>
    <style>
        :root {
            /* any style variables here */
            --background-color: rgb(125, 122, 122);
        }

        body {
            font-family: Arial, Arial, Helvetica, sans-serif;
            background-color: var(--background-color);
            padding: 5px;
            /* top and side padding*/
        }

        h1 {
            color: blue
        }

        .console-window {
            background-color: #1e1e1e;
            width: 300px;
            height: 150px;
            overflow: auto;
            border: 2px solid #ccc;
            color: #00ff00;
            font-family: 'Courier New', Courier, monospace;
            padding: 15px;
            border-radius: 6px;
            overflow-y: auto;
            
        }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="scripts.js" defer></script>

</head>

<body>
    <table> <!-- Divides graphs, CAN tap and console -->
        <tr>
            <th> <!-- Graph layout-->
                <table>
                    <tr>
                        <th>
                            <div style="width: 800px;"><canvas id="firstTestChart"></canvas></div>
                        </th>
                        <th>
                            <div style="width: 800px;"><canvas id="secondTestChart"></canvas></div>
                        </th>
                    </tr>
                    <tr>
                        <th>Port 2 Volts</th>
                        <th>Port 2 Current</th>
                    </tr>
                </table>
            </th>
            <th> <!-- Console window -->
                <div id="console-output" class="console-window"; >
                    This is in the window
                </div>
                <code>this is code</code>
                
                <form id="usr_cmd_form">
                    <input type="text" id="usr_cmd" placeholder="\* enter command \*">
                    <button type="submit">send</button>
                </form>
            </th>

        </tr>
    </table>



</body>

</html>
